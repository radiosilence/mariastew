name: CI/CD

# Two halves in one run, so the second ships what the first built.
#
# CI checks the change and ends in `Checks`, the one status a ruleset should
# require. Each job runs only for the domains the change touches (see
# `changes`); a skipped job passes `Checks`, a failed or cancelled one fails
# it. Jobs can therefore be added, renamed or skipped without touching branch
# protection.
#
# CD runs after `Checks` has passed on main. Every push that rebuilt the image
# moves its `main` tag; a push that changes the version also releases: the
# image's version tags and `latest`, the Pulumi package and the GitHub
# release, in that order. CD ships what CI built: the image `container` pushed
# under the commit, from the static binaries `linux-build` compiled.
on:
  push:
    branches: [main]
  # Every PR, including ones stacked on another PR's branch.
  pull_request:
  # Releases whatever version is not yet released: how a failed release is
  # retried.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

# A pull request's newer push cancels its older run; on main, a newer push
# cancels an older one that releases nothing. A run that may release is in a
# group of its own and is never cancelled, and nor is a manual run, which is
# how a failed release is retried. The group is chosen before any job runs, so
# it cannot ask `changes`: a push may release when its head commit is titled
# `release: ` or changes Cargo.toml, where the version lives.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (startsWith(github.event.head_commit.message, 'release: ') || contains(github.event.head_commit.modified, 'Cargo.toml')) && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'release: ') && !contains(github.event.head_commit.modified, 'Cargo.toml')) }}"

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  # Tags are output, not input: the version in Cargo.toml is the source of
  # truth, and a release exists because that number changed. Nothing here reads
  # a tag to decide what to build.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      package: ${{ steps.filter.outputs.package }}
      docker: ${{ steps.filter.outputs.docker }}
      release: ${{ steps.filter.outputs.release }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        # A push diffs against the last main commit whose run passed, so a
        # cancelled or failed run's changes reach CD with the next one. Domains
        # are allowlists: a new top-level directory of code is invisible here
        # until it is added. Under pipefail, greps run in conditions and never
        # exit early with -q.
        run: |
          rust=true package=true docker=true release=false
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          base=HEAD^1
          if [ "$EVENT" = "push" ]; then
            base=
            if passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --branch main --event push \
                  --status success --limit 1 --json headSha --jq '.[0].headSha // empty') \
              && [ -n "$passed" ] && git fetch -q --deepen=200 origin main \
              && git merge-base --is-ancestor "$passed" HEAD; then
              base=$passed
              # A re-run of a commit that passed diffs against its parent.
              if [ "$passed" = "$(git rev-parse HEAD)" ]; then
                base=HEAD^1
              fi
            else
              echo "no passing run to diff against -- running everything"
            fi
          fi
          # Whether this run releases, the one answer every release job reads.
          # A pull request: a release PR (branch `release-v*`, or a version
          # change), which runs everything. A push: it changes the version
          # (against its parent, not the diff's base: a push landing while a
          # release run is still going would otherwise release it again) and
          # that version is not out yet. A manual run: whatever version is not
          # out yet. Only main releases. Only a 404 means the version is not
          # out: any other error fails this job, since guessing either way
          # releases twice or never.
          version=$(version_of < Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no version in Cargo.toml"
            exit 1
          fi
          bumped=false
          if [ "$(git show HEAD^1:Cargo.toml 2>/dev/null | version_of)" != "$version" ]; then
            bumped=true
          fi
          case "$EVENT" in
            pull_request)
              case "$HEAD_REF" in release-v*) bumped=true ;; esac
              release=$bumped
              ;;
            *)
              if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$bumped" = true ]; }; then
                if ! answer=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
                  if [[ "$answer" != *"HTTP 404"* ]]; then
                    echo "::error::could not tell whether v$version is released: $answer"
                    exit 1
                  fi
                  release=true
                fi
              fi
              ;;
          esac
          touches() { printf '%s\n' "$files" | grep -E "$1" | grep -vE '\.md$' > /dev/null; }
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$release" = false ] && [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            echo "changes since $(git rev-parse --short "$base"):"
            printf '%s\n' "$files" | sed 's/^/  /'
            # Anything cargo compiles or that decides how. The server embeds
            # its templates and the committed assets, and build.rs names the
            # script bundle, so they are Rust too. mise.toml pins the
            # toolchain `check` runs; no other job reads it.
            touches '^src/|^templates/|^assets/|^build\.rs$|^Cargo\.(toml|lock)$|^mise\.toml$|^\.github/' || rust=false
            touches '^deploy/pulumi/|^\.github/' || package=false
            # The static binaries and the image that copies them in. `check`
            # already checks the code, so a pull request builds these only
            # when the recipe or the lockfile changed, since the musl build
            # compiles C dependencies (aws-lc-sys) that the glibc test build
            # does not; main whenever the binary changed, since CD ships it.
            if [ "$EVENT" = "pull_request" ]; then
              touches '^Dockerfile$|^Cargo\.lock$|^\.github/' || docker=false
            else
              touches '^src/|^templates/|^assets/|^build\.rs$|^Cargo\.(toml|lock)$|^Dockerfile$|^\.github/' || docker=false
            fi
          fi
          {
            echo "rust=$rust"
            echo "package=$package"
            echo "docker=$docker"
            echo "release=$release"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"

  # The arm64 runners are few. A release cancels this repository's pull
  # request runs, which are re-run from their page or by the next push, and
  # main's runs older than it that release nothing, which it supersedes (its
  # diff covers their commits). A later push is left alone, as is any run
  # whose commit is titled `release: ` or changes Cargo.toml, matching the
  # workflow's concurrency rule. Best effort: a failure here is reported and
  # holds nothing up. A job of its own, so only it holds a token that can
  # cancel runs. The release builds wait for it, so they queue on the runners
  # it frees.
  make-room:
    name: Make room for the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.release == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.run_id }}
        run: |
          for status in requested queued pending waiting in_progress; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --status "$status" --limit 100 \
              --json databaseId,event,headBranch,headSha,displayTitle \
              --jq ".[] | select(.databaseId < $SELF)
                | select(.event == \"pull_request\" or (.event == \"push\" and .headBranch == \"main\" and (.displayTitle | startswith(\"release: \") | not)))
                | \"\\(.databaseId) \\(.event) \\(.headSha)\"" \
              || echo "::warning::could not list $status runs" >&2
          done | sort -u | while read -r id event sha; do
            if [ "$event" = push ]; then
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.files[].filename') || continue
              if grep -qx 'Cargo.toml' <<< "$files"; then
                continue
              fi
            fi
            echo "cancelling run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  # On the floating `rust = "1"` from mise.toml rather than the toolchain
  # `linux-build` pins: a compiler bump breaking is the point here, and
  # precisely not the point there.
  check:
    name: Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

  # The Pulumi component in deploy/pulumi. Typechecked and tested like the
  # crate, and gating the publish, so no chart is released that does not
  # compile against the API it exports.
  chart:
    name: Chart
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.package == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - run: npm run build
      # What gets published, not what got built. mcp-gateway shipped a tarball
      # holding package.json and a README once, because the build ran in one job
      # and `npm publish` in another. `prepublishOnly` is the fix; this notices
      # if it stops working.
      - name: Check the tarball carries the build
        run: |
          npm pack --dry-run --json > pack.json
          # shellcheck disable=SC2016 # the ${} below is JavaScript's
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const missing = ["dist/index.js", "dist/index.d.ts"].filter(
              (f) => !files.includes(f),
            );
            if (missing.length) {
              console.error(`::error::tarball is missing ${missing.join(", ")}`);
              console.error(files.join("\n"));
              process.exit(1);
            }
            console.log(`${files.length} files, dist included`);
          '

  # One number for the app and the chart that deploys it, so a pin on the
  # package says exactly which build you get. Three files state it; this is
  # what stops them drifting. Runs on pull requests too, so one that moves a
  # single number fails before it merges.
  version:
    name: Version
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.package == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - env:
          CRATE: ${{ needs.changes.outputs.version }}
        run: |
          CHART=$(node -p "require('./deploy/pulumi/package.json').version")
          APP=$(sed -n 's/^export const APP_VERSION = "\(.*\)";$/\1/p' deploy/pulumi/src/versions.ts)
          echo "Cargo.toml=$CRATE package.json=$CHART APP_VERSION=$APP"
          if [ "$CRATE" != "$CHART" ] || [ "$CRATE" != "$APP" ]; then
            echo "::error::versions disagree: Cargo.toml $CRATE, package.json $CHART, versions.ts $APP"
            exit 1
          fi

  # Compiled on the runner rather than in the image (docs/design.md says
  # why), natively per architecture.
  linux-build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [changes, make-room]
    if: ${{ !cancelled() && needs.changes.outputs.docker == 'true' && (needs.make-room.result == 'success' || needs.make-room.result == 'skipped') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          # Pinned, because this is what ships; `check` floats.
          toolchain: "1.97"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # `container` unpacks `mariastew-bin-<arch>` into `dist/<arch>`, which
      # the Dockerfile reads by TARGETARCH, so the suffix is the contract.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mariastew-bin-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/mariastew
          if-no-files-found: error
          # Only has to survive the hop to `container`; CD ships the image,
          # not this artifact.
          retention-days: 7

  # The binaries above on alpine, for both architectures, in one build. A pull
  # request builds it to prove it builds. Main pushes it under the commit, in
  # parallel with the checks: nothing deploys a commit tag, and CD moves
  # `main`, and a release's version tags and `latest`, onto it only once
  # `Checks` has passed.
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, linux-build]
    if: ${{ !cancelled() && needs.linux-build.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mariastew-bin-*
      - run: |
          mkdir -p dist/amd64 dist/arm64
          mv mariastew-bin-amd64/mariastew dist/amd64/
          mv mariastew-bin-arm64/mariastew dist/arm64/
      # The `apk add` layer runs emulated for arm64. It depends on nothing of
      # mariastew's, so the registry cache keeps it.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record would be uploaded as an artifact of this run.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Read by `container-main`, so `main` only moves forward.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # The layer cache lives beside the image in GHCR rather than in the
          # repository's Actions cache, which the Rust caches need. Written
          # from main only; anything else reads it.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

  # The one status a ruleset should require. Skipped jobs are domains the
  # change does not touch and pass; anything failed or cancelled fails it.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, make-room, check, chart, version, linux-build, container]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $bad"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # Main only, after `Checks`. `checks` runs whatever its needs did, so every
  # job here states the results it depends on rather than relying on the
  # default, which would skip it whenever any job upstream was skipped.

  # `main` and `sha-<short>` follow the last commit whose checks passed and
  # changed the image. Retagging needs no rebuild. A release run and a later
  # push can finish in either order, so `main` moves only to a commit that
  # descends from the one it holds.
  container-main:
    name: Container image (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, checks, container]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.checks.result == 'success' && needs.container.result == 'success' }}
    # One at a time across runs: two that read the tag together could both
    # see their commit ahead, and the one finishing last would win. A group
    # keeps one pending job and cancels it when another queues, so release
    # runs, which must not be cancelled, wait in a group of their own.
    concurrency:
      group: container-main${{ needs.changes.outputs.release == 'true' && '-release' || '' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A missing tag, a tag without the label, or a labelled commit that
      # history no longer leads to (gone, or diverged after a force-push)
      # retags. Any other failure is retried, then fails the job: retagging on
      # a guess can move `main` backwards.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attempt() {
            local n
            for n in 1 2 3; do
              "$@" && return 0
              sleep $((n * 10))
            done
            return 1
          }
          read_tag() {
            if docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Image}}' > tag.json 2> tag.err; then
              current=$(jq -r '[.. | objects | .config.Labels?["org.opencontainers.image.revision"]? // empty][0] // empty' tag.json)
            elif grep -qF "$IMAGE:main: not found" tag.err; then
              current=
            else
              cat tag.err >&2
              return 1
            fi
          }
          compare() {
            if gh api "repos/$GITHUB_REPOSITORY/compare/$current...$GITHUB_SHA" --jq .status > compare.out 2> compare.err; then
              status=$(cat compare.out)
            elif grep -q 'HTTP 404' compare.err; then
              status=gone
            else
              cat compare.err >&2
              return 1
            fi
          }
          tags=(-t "$IMAGE:sha-${GITHUB_SHA::7}" -t "$IMAGE:main")
          attempt read_tag || { echo "::error::cannot read $IMAGE:main"; exit 1; }
          if [ -n "$current" ] && [ "$current" != "$GITHUB_SHA" ]; then
            attempt compare || { echo "::error::cannot compare $current with $GITHUB_SHA"; exit 1; }
            case "$status" in
              ahead) ;;
              gone|diverged) echo "::notice::main holds $current, which history no longer leads to ($status); retagging" ;;
              *)
                echo "::notice::main holds $current, which this commit does not descend from ($status); leaving it"
                tags=(-t "$IMAGE:sha-${GITHUB_SHA::7}")
                ;;
            esac
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$GITHUB_SHA"

  # The image this commit already pushed, tagged with the release's version,
  # its major.minor and major (no `v`: the chart pins `APP_VERSION` as is), and
  # `latest`. Retagging needs no rebuild, and repeats safely. A prerelease
  # gets its exact version only, so nobody runs one by accident.
  container-release:
    name: Container image (release tags)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, checks, container]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.release == 'true' && needs.checks.result == 'success' && needs.container.result == 'success' }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          tags=(-t "$IMAGE:$VERSION")
          case "$VERSION" in
            *-*) ;;
            *) tags+=(-t "$IMAGE:${VERSION%.*}" -t "$IMAGE:${VERSION%%.*}" -t "$IMAGE:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$GITHUB_SHA"

  # After the image's version tag, which the package pins: a published package
  # promises an image that exists, and a package version cannot be reused.
  publish-chart:
    name: Publish chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [container-release]
    if: ${{ !cancelled() && needs.container-release.result == 'success' }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@radiosilence"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - run: npm ci
      # A version cannot be published twice, so a retried release skips one
      # already out and goes on to the GitHub release. Only a 404 means it is
      # not out; any other error fails rather than guessing.
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if out=$(npm view "$spec" version 2>&1); then
            echo "$spec is already published"
            exit 0
          fi
          if [[ "$out" != *E404* ]]; then
            echo "::error::cannot tell whether $spec is published: $out"
            exit 1
          fi
          npm publish

  # Last, so a release never names an image or a package that does not exist.
  # The updater reads these releases and moves the deployment's dependency pin.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, checks, container-release, publish-chart]
    # Every need having run, not merely not failed: a release without one of
    # its parts is not a release.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.checks.result == 'success' && needs.container-release.result == 'success' && needs.publish-chart.result == 'success' && needs.changes.outputs.release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Notes are scoped with git log, which needs history and tags.
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          prev=$(git tag --list 'v*' --sort=-version:refname | head -1)
          range=${prev:+$prev..}HEAD
          notes=$(git log --no-merges --pretty='- %s' "$range")
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "${notes:-- No changes recorded for this container.}"
