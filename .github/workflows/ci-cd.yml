name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Tags are output, not input: the version in Cargo.toml is the source of truth,
  # and a release exists because that number changed. Nothing here reads a tag to
  # decide what to build, so there is no second place to keep in step by hand.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read the version, and ask whether it has been released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "no version in Cargo.toml" >&2
            exit 1
          fi
          # Whether this exact release exists, rather than a comparison with the
          # newest one, so a revert or a re-run does not try to cut a version that
          # is already out.
          if gh release view "v$version" >/dev/null 2>&1; then
            release=false
          else
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $version, release $release"

  # The Pulumi component in deploy/pulumi. Typechecked and tested like the
  # crate, and gating the publish below, so no chart is released that does not
  # compile against the API it exports.
  chart:
    name: Chart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json

      - run: npm ci

      # One number for the app and the chart that deploys it, so a pin on the
      # package says exactly which build you get. Three files state it; this is
      # what stops them drifting.
      - name: Check the chart agrees with the crate
        run: |
          crate=$(grep -m1 '^version = ' ../../Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          pkg=$(node -p "require('./package.json').version")
          app=$(sed -n 's/^export const APP_VERSION = "\(.*\)";$/\1/p' src/versions.ts)
          echo "Cargo.toml=$crate package.json=$pkg APP_VERSION=$app"
          [ "$crate" = "$pkg" ] && [ "$crate" = "$app" ] || {
            echo "::error::version mismatch — Cargo.toml=$crate package.json=$pkg APP_VERSION=$app"
            exit 1
          }

      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - run: npm run build

      # What gets published, not what got built. mcp-gateway shipped a tarball
      # holding package.json and a README once, because the build ran in one job
      # and `npm publish` in another. `prepublishOnly` is the fix; this notices
      # if it stops working.
      - name: Check the tarball carries the build
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const missing = ["dist/index.js", "dist/index.d.ts"].filter(
              (f) => !files.includes(f),
            );
            if (missing.length) {
              console.error(`::error::tarball is missing ${missing.join(", ")}`);
              console.error(files.join("\n"));
              process.exit(1);
            }
            console.log(`${files.length} files, dist included`);
          '

  # Gates the publish, not the compile. `binary` is the long pole, so it starts
  # at once and this runs alongside it; putting it in front would add the check
  # to the critical path of every green run to save a compile on a red one. On
  # the floating `rust = "1"` from mise.toml rather than the toolchain `binary`
  # pins: a compiler bump breaking is the point here, and precisely not the
  # point there.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      # After mise, which is what puts this cargo on PATH.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # No key, so this keeps the cache the job had in ci-cd.yml. It shares
          # nothing with `binary`'s anyway — that one is keyed per musl target,
          # and a release cross-build has no artefact in common with a
          # host-target debug one.
          # A pull request restores main's cache but writes none of its own: a
          # branch's cache is invisible to every other branch and still evicts
          # from the repository's 10GB, which is how main ends up cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check and Test
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

  # Compiled here rather than inside `docker build`, because a cargo build in a
  # Dockerfile is one atomic layer: bumping a single crate recompiles all ~200
  # of them, 168s against the 15s our own code costs. rust-cache restores
  # cargo's own cache, which is per-crate, so only what actually moved is
  # rebuilt. Still one runner per architecture, natively, so nothing is
  # emulated and musl is the host's own target rather than a cross.
  binary:
    name: Compile ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          # Pinned, because this is what ships — the floating `rust = "1"` in
          # mise.toml covers clippy and the tests, where a compiler bump
          # breaking is the point. Dockerfile.dev keeps its own copy for the
          # dev image, which ships nowhere.
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          # A pull request restores main's cache but writes none of its own: a
          # branch's cache is invisible to every other branch and still evicts
          # from the repository's 10GB, which is how main ends up cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The publish job unpacks `<context-artifact>-<arch>` into the build
      # context of the leg with that architecture, so the suffix is the
      # contract rather than a label.
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mariastew-bin-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/mariastew
          if-no-files-found: error
          # Only has to survive the hop to the publish job.
          retention-days: 1

  publish:
    name: Build and Publish
    needs: [version, binary, check]
    # Builds each architecture on a native runner. `version` publishes the semver
    # tags, which metadata-action cannot derive here because the build runs on a
    # branch push with no tag to read.
    uses: radiosilence/blit-workflows/.github/workflows/build-publish-container.yml@644a5b0b8398f5e038a4639991fdddc623afe5eb # context-artifact
    with:
      image: "mariastew"
      context-artifact: "mariastew-bin"
      version: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || '' }}
    secrets:
      PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # After publish, for the reason release is: publishing the chart is a promise
  # that the image it pins is pullable, and a chart naming an image nobody built
  # is worse than no chart.
  publish-chart:
    name: Publish Chart
    runs-on: ubuntu-latest
    needs: [version, chart, publish]
    if: needs.version.outputs.release == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@radiosilence"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json

      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After publishing, so a release never names an image that does not exist. The
  # updater reads these releases and moves the deployment's dependency pin.
  release:
    name: Release
    needs: [version, publish, publish-chart]
    if: needs.version.outputs.release == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Notes are scoped with git log, which needs history and tags.
          fetch-depth: 0

      - name: Create the release, and its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          prev=$(git tag --list 'v*' --sort=-version:refname | head -1)
          range=${prev:+$prev..}HEAD
          notes=$(git log --no-merges --pretty='- %s' "$range")
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "${notes:-- No changes recorded for this container.}"
