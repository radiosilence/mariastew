[package]
name = "mariastew"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8"
base64 = "0.23.1"
futures-core = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
async-stream = "0.3.6"
futures-util = "0.3.34"
axum-extra = { version = "0.12.6", features = ["form"] }

[dev-dependencies]
# `oneshot`, to drive the router in a test without binding a port.
tower = { version = "0.5", features = ["util"] }
