[tools]
node = "24"
# rustfmt and clippy are not in the minimal profile mise installs by default,
# and the check job needs both.
rust = { version = "1", components = "rustfmt,clippy" }
actionlint = "1.7.12"
shellcheck = "0.11.0"
just = "latest"

[tasks."css"]
description = "Rebuild the stylesheet after changing a template"
run = "./node_modules/.bin/tailwindcss -i styles/app.css -o assets/app.css --minify"
# The output is committed, so cargo build needs no node toolchain and the
# container build has one artefact rather than two.

[tasks."js"]
description = "Rebuild the browser bundle after changing web/"
# One hashed file holding app code and the vendored Datastar, so a deploy's new
# script cannot be served from a cache holding the old one. Typechecking is
# `typecheck`'s job. Sequential: the old hash's file has to be gone before
# build.rs globs for the new one, or it finds two and refuses to guess.
run = [
  "rm -f assets/app-*.js",
  "./node_modules/.bin/rolldown web/main.ts --platform browser --format esm --minify --dir assets --entryFileNames app-[hash].js",
]
# The output is committed, same deal as app.css.

[tasks."datastar"]
description = "Vendor a Datastar release into web/vendor (then `mise run js`)"
# npm only carries Datastar's pre-1.0 betas, so the release bundle comes from
# the tagged source instead.
run = """
set -eu
v="${DATASTAR_VERSION:?set DATASTAR_VERSION, e.g. v1.0.4}"
curl -fsSL "https://cdn.jsdelivr.net/gh/starfederation/datastar@$v/bundles/datastar.js" -o web/vendor/datastar.js
"""

[tasks."typecheck"]
description = "Type check the browser script and the deploy chart"
run = [
  "./node_modules/.bin/tsc -p tsconfig.web.json",
  "./deploy/pulumi/node_modules/.bin/tsc -p deploy/pulumi/tsconfig.json",
]

[tasks."icons"]
description = "Add a macro for any icons::<name> a template calls that templates/icons.html doesn't define yet"
run = "./scripts/gen-icons.ts"

[tasks."app-icons"]
description = "Render icons/icon.svg into the favicon, apple-touch and manifest icons (needs `brew install librsvg`)"
# The outputs are committed, same deal as app.css: main.rs include_bytes!s
# them, so no build ever needs librsvg.
run = "./scripts/gen-app-icons.ts"

# docker-compose's own `seed` service seeds these roots on every `up` — these
# two are for outside docker: the plain `cargo run` flow in "Local
# development", or resetting the fixtures without a full compose cycle.
[tasks."seed"]
description = "Populate the local tv/movies roots with names shaped like the real library"
run = "./scripts/seed-dev-fixtures.ts"

[tasks."seed:reset"]
description = "Wipe the local tv/movies roots and reseed from scratch"
run = "./scripts/seed-dev-fixtures.ts --reset"

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "actionlint"
