[tools]
node = "24"
# rustfmt and clippy are not in the minimal profile mise installs by default,
# and the check job needs both.
rust = { version = "latest", components = "rustfmt,clippy" }
actionlint = "1.7.12"
shellcheck = "0.11.0"
just = "latest"
aube = "2.8.5"

[tasks."js"]
description = "Rebuild the browser bundle after changing web/"
# One file holding the app's code. The server names it by a hash of its bytes
# (askama_datastar's `Asset`), so a deploy's new script is never served from a
# cache holding the old one. Datastar is askama_datastar's, served beside it.
# Typechecking is `typecheck`'s job.
run = "./node_modules/.bin/rolldown web/main.ts --platform browser --format esm --minify --dir assets --entryFileNames app.js"
# The output is committed, as assets/app.css is (`just css`).

[tasks."typecheck"]
description = "Type check the browser script and the deploy chart"
depends = ["typecheck:web"]
run = "./deploy/pulumi/node_modules/.bin/tsc -p deploy/pulumi/tsconfig.json"

[tasks."typecheck:web"]
description = "Type check the browser script"
run = "./node_modules/.bin/tsc -p tsconfig.web.json"

[tasks."lint"]
description = "Lint and format-check the TypeScript"
run = [
  "./node_modules/.bin/oxlint --deny-warnings web/*.ts scripts deploy/pulumi/src",
  "./node_modules/.bin/oxfmt --check web/*.ts scripts deploy/pulumi/src",
]

[tasks."fmt"]
description = "Format the TypeScript"
run = "./node_modules/.bin/oxfmt web/*.ts scripts deploy/pulumi/src"

[tasks."icons"]
description = "Add a macro for any icons::<name> a template calls that templates/icons.html doesn't define yet"
run = "./scripts/gen-icons.ts"

[tasks."app-icons"]
description = "Render icons/icon.svg into the favicon, apple-touch and manifest icons (needs `brew install librsvg`)"
# The outputs are committed, same deal as app.css: main.rs include_bytes!s
# them, so no build ever needs librsvg.
run = "./scripts/gen-app-icons.ts"

# docker-compose's own `seed` service seeds these roots on every `up` — these
# two are for outside docker: the plain `cargo run` flow in "Local
# development", or resetting the fixtures without a full compose cycle.
[tasks."seed"]
description = "Populate the local tv/movies roots with names shaped like the real library"
run = "./scripts/seed-dev-fixtures.ts"

[tasks."seed:reset"]
description = "Wipe the local tv/movies roots and reseed from scratch"
run = "./scripts/seed-dev-fixtures.ts --reset"

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "actionlint"
